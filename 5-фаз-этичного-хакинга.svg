<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" font-size="26" font-weight="bold" fill="#222">5 фаз этичного хакинга</text>

  <!-- Center circle -->
  <circle cx="450" cy="380" r="80" fill="#eef3fa" stroke="#4a6fa5" stroke-width="2"/>
  <text x="450" y="372" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c4a7c">Цикл этичного</text>
  <text x="450" y="394" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c4a7c">хакинга</text>

  <!-- Phase 1: Reconnaissance (top) -->
  <circle cx="450" cy="150" r="70" fill="#4a90d9" stroke="#2c5f9e" stroke-width="2"/>
  <text x="450" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">1. Разведка</text>
  <text x="450" y="162" text-anchor="middle" font-size="12" fill="#e8f0fa">(Footprinting)</text>

  <!-- Phase 2: Scanning (top-right) -->
  <circle cx="680" cy="290" r="70" fill="#5ba3e0" stroke="#2c5f9e" stroke-width="2"/>
  <text x="680" y="285" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">2. Сканирование</text>
  <text x="680" y="307" text-anchor="middle" font-size="12" fill="#e8f0fa">(Scanning)</text>

  <!-- Phase 3: Gaining Access (bottom-right) -->
  <circle cx="595" cy="555" r="70" fill="#6cb0e8" stroke="#2c5f9e" stroke-width="2"/>
  <text x="595" y="545" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">3. Получение</text>
  <text x="595" y="567" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">доступа</text>

  <!-- Phase 4: Maintaining Access (bottom-left) -->
  <circle cx="305" cy="555" r="70" fill="#7dbcec" stroke="#2c5f9e" stroke-width="2"/>
  <text x="305" y="545" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">4. Поддержание</text>
  <text x="305" y="567" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">доступа</text>

  <!-- Phase 5: Covering Tracks (top-left) -->
  <circle cx="220" cy="290" r="70" fill="#8fc9f0" stroke="#2c5f9e" stroke-width="2"/>
  <text x="220" y="285" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">5. Сокрытие</text>
  <text x="220" y="307" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">следов</text>

  <!-- Arrows between phases (clockwise) -->
  <path d="M 512 185 L 615 250" stroke="#555" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 710 358 L 660 485" stroke="#555" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 525 570 L 375 570" stroke="#555" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 242 485 L 192 358" stroke="#555" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 288 250 L 388 185" stroke="#555" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Legend / descriptions -->
  <text x="450" y="655" text-anchor="middle" font-size="13" fill="#555">Сбор информации → Поиск уязвимостей → Эксплуатация → Персистентность → Скрытие следов</text>
  <text x="450" y="680" text-anchor="middle" font-size="12" fill="#888">По завершении всех фаз составляется отчёт с рекомендациями по устранению уязвимостей</text>
</svg>
